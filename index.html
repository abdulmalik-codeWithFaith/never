<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <header>
                <div class="avatar">
                    <img src="https://via.placeholder.com/40" alt="User Avatar">
                    
                </div>
                <div class="icons">
                    <button><img src="https://via.placeholder.com/24" alt="Icon 1"></button>
                    <button><img src="https://via.placeholder.com/24" alt="Icon 2"></button>
                </div>
            </header>
            <div class="search">
                <input type="text" placeholder="Search or start new chat">
            </div>
            <div class="chats"></div>
        </div>
        <div class="chat-area">
            <header>
                <div class="avatar">
                    <img src="https://via.placeholder.com/40" alt="Chat Avatar">
                </div>
                <div class="chat-title">
                    <h3>Chat Name</h3>
                    <span>last seen today at 12:30 PM</span>
                </div>
                <div class="icons">
                    <button><img src="https://via.placeholder.com/24" alt="Icon 3"></button>
                    <button><img src="https://via.placeholder.com/24" alt="Icon 4"></button>
                </div>
            </header>
            <div class="messages"></div>
            <div class="message-input"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
